[project]
name = "burndrop"
version = "0.1.0"
description = "One-time, end-to-end encrypted secret exchange between humans and AI agents through a zero-knowledge relay"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "burndrop contributors" }]
requires-python = ">=3.10"
keywords = ["secrets", "credentials", "agents", "mcp", "encryption", "libsodium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = ["pynacl==1.6.2"]

[project.urls]
Homepage = "https://github.com/xyluxx/burndrop"
Documentation = "https://github.com/xyluxx/burndrop/tree/main/sdk/python"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PL"]
ignore = [
    "PLR0911", # many returns are the clearest shape for validators
    "PLR0912", # branches in strict parsers mirror the Go reference
    "PLR0913", # public API functions take several keyword arguments
    "PLR0915",
    "PLR0917",
    "PLR2004", # sizes and codes from the specification are named where it helps
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "RUF001", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
