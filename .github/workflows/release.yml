name: release

# On a version tag: build the page, the extension, the binaries (GoReleaser,
# signed with Sigstore, with SBOMs), the container image (signed, attested),
# the npm packages, and the PyPI package. The GitHub release starts as a
# draft and is published only after the workflow has verified its own
# signatures and the page hash.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/burndrop-relay

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the page
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx vitest run
          node build.mjs --version "${GITHUB_REF_NAME}"
          echo "Page SHA-256: $(cut -d' ' -f1 dist/page.sha256)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page
          path: |
            web/dist/page.html
            web/dist/page.meta.json
            web/dist/page.sha256
            web/build/ext
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    needs: page
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: page
          path: web
      - name: Package the extension
        working-directory: extension
        run: |
          npm ci --no-audit --no-fund
          node build.mjs --version "${GITHUB_REF_NAME#v}"
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension
          path: |
            extension/dist/*.zip
            extension/dist/*.sha256
          if-no-files-found: error

  binaries:
    runs-on: ubuntu-latest
    needs: [page, extension]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: page
          path: web
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension
          path: extension/dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Tests
        run: go test -race -count=1 $(go list ./... | grep -v /node_modules/)
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            web/dist/page.html
            extension/dist/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/burndrop_*/burndrop
            dist/burndrop_*/burndrop.exe
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    needs: page
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  npm:
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish the CLI wrapper packages (trusted publishing, with provenance)
        run: |
          node npm/make-packages.mjs --version "${GITHUB_REF_NAME#v}" --dist dist --out npm/out
          for dir in npm/out/platform/*/; do (cd "$dir" && npm publish --provenance --access public); done
          (cd npm/out/burndrop && npm publish --provenance --access public)
      - name: Publish the TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
          npm run build
          npm publish --provenance --access public

  pypi:
    runs-on: ubuntu-latest
    needs: binaries
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build
        working-directory: sdk/python
        run: |
          uv version "${GITHUB_REF_NAME#v}"
          uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist

  publish:
    runs-on: ubuntu-latest
    needs: [binaries, image, npm, pypi]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: page
          path: page
      - name: Verify the draft release, then publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/v
        run: |
          set -euo pipefail
          mkdir verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'checksums.txt*' --pattern 'page.sha256' --pattern 'page.html'
          cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
            --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
          sha256sum -c page.sha256
          diff page.sha256 ../page/dist/page.sha256
          cosign verify "${IMAGE}@${DIGEST}" --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          hash=$(cut -d' ' -f1 page.sha256)
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | sed "s/^## Verify this release/## Verify this release\n\nDrop page SHA-256: \`$hash\`\nImage: \`${IMAGE}@${DIGEST}\`\n/")
